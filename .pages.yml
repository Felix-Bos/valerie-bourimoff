# Interface d'administration du site : https://app.pagescms.org
# Chaque enregistrement crée un commit sur main ; .github/workflows/publier.yml
# reconstruit alors le site (scripts/build.py) et le publie en 1 à 2 minutes.

media:
  - name: oeuvres
    label: Photos des œuvres
    input: medias/oeuvres
    output: medias/oeuvres
    extensions: [jpg, jpeg, png, webp, heic, heif]
    rename: random

settings:
  commit:
    templates:
      create: "Ajout de {path} (Pages CMS)"
      update: "Modification de {path} (Pages CMS)"
      delete: "Suppression de {path} (Pages CMS)"
      rename: "Renommage de {oldPath} en {newPath} (Pages CMS)"

components:
  oeuvre:
    type: reference
    options:
      collection: oeuvres
      value: "{path}"
      label: "{titre} · {technique} {annee}"
      search: "titre,technique,annee"

content:
  - name: oeuvres
    label: Œuvres
    description: Le catalogue du site. Une fiche par œuvre ; la photo est redimensionnée automatiquement.
    type: collection
    path: content/oeuvres
    format: json
    filename: "{titre}-{year}{month}{day}{hour}{minute}{second}.json"
    operations:
      rename: false
    view:
      primary: titre
      fields: [image, titre, technique, annee]
      search: [titre, technique, annee]
      sort: [annee, titre]
      default:
        sort: annee
        order: desc
    fields:
      - name: image
        label: Photo
        type: image
        required: true
        description: Une photo bien droite, cadrée au ras de l'œuvre (JPG, PNG, WebP ou HEIC).
        options:
          media: oeuvres
      - name: titre
        label: Titre
        type: string
        description: Laisser vide si l'œuvre est sans titre.
      - name: technique
        label: Technique
        type: string
        description: "Par exemple : Acrylique, Aquarelle, Huile, Technique mixte, Fusain."
      - name: dimensions
        label: Dimensions
        type: string
        description: "Facultatif. Par exemple : 50 × 70 cm."
      - name: annee
        label: Année
        type: string
        pattern:
          regex: "^(\\d{4})?$"
          message: Indiquez l'année sur 4 chiffres, par exemple 2025.
      - name: categorie
        label: Catégorie
        type: select
        required: true
        default: peinture
        description: Sert aux filtres de la page Œuvres.
        options:
          values:
            - { name: peinture, label: Peinture }
            - { name: aquarelle, label: Aquarelle }
            - { name: dessin, label: Dessin }
      - name: chapitre
        label: Chapitre
        type: reference
        required: true
        description: La période ou la série où l'œuvre apparaît. Pour une nouvelle année, créez d'abord le chapitre dans « Chapitres ».
        options:
          collection: chapitres
          value: "{path}"
          label: "{nom} — {titre}"
          search: "nom,titre"
      - name: ordre
        label: Position dans le chapitre
        type: number
        description: 1 pour la placer en premier. Laisser vide pour la mettre à la fin.
        options:
          min: 1

  - name: chapitres
    label: Chapitres
    description: Les périodes et séries de la page Œuvres. Les années sont classées de la plus récente à la plus ancienne, les autres noms (Dessins…) viennent après.
    type: collection
    path: content/chapitres
    format: json
    filename: "{nom}.json"
    operations:
      rename: false
    view:
      primary: nom
      fields: [nom, titre]
      default:
        sort: nom
        order: desc
    fields:
      - name: nom
        label: Nom
        type: string
        required: true
        description: Une année (par exemple 2025) ou un mot (par exemple Dessins).
      - name: titre
        label: Titre
        type: string
        required: true
      - name: intro
        label: Texte d'introduction
        type: text
        description: Facultatif.
      - name: illustration
        label: Image sur la page d'accueil
        component: oeuvre
        description: Facultatif. Par défaut, la première œuvre du chapitre.

  - name: accueil
    label: Page d'accueil
    type: file
    path: content/accueil.json
    format: json
    operations:
      delete: false
    fields:
      - name: ouverture
        label: Les 4 œuvres de l'ouverture
        component: oeuvre
        description: Les tableaux qui entourent le nom en haut de la page. Les deux premiers affichent leur titre.
        list:
          min: 4
          max: 4
          collapsible: false
      - name: selection
        label: Œuvres choisies
        component: oeuvre
        description: Le défilé « Œuvres choisies », dans cet ordre.
        list:
          min: 1
          collapsible: false
      - name: lieux
        label: Lieux d'exposition qui défilent
        type: string
        list: true

  - name: biographie
    label: Biographie
    type: file
    path: content/biographie.json
    format: json
    operations:
      delete: false
    fields:
      - name: demarche
        label: Démarche (français)
        type: text
        description: Laisser une ligne vide entre deux paragraphes. Le premier paragraphe est mis en avant.
      - name: demarche_en
        label: Démarche (anglais)
        type: text
      - name: citation
        label: Citation en grand
        type: string
      - name: formations
        label: Formations
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{nom}"
        fields:
          - name: nom
            label: Atelier ou école
            type: string
            required: true
          - name: detail
            label: Lieu ou professeurs
            type: string
      - name: expositions
        label: Expositions
        description: Elles sont classées automatiquement, de la plus récente à la plus ancienne.
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{annee} — {titre}"
        fields:
          - name: annee
            label: Année
            type: string
            required: true
            description: Une année (2025) ou une période (2019 — 2025).
          - name: titre
            label: Exposition ou salon
            type: string
            required: true
          - name: lieu
            label: Lieu
            type: string

  - name: reglages
    label: Réglages
    type: file
    path: content/reglages.json
    format: json
    operations:
      delete: false
    fields:
      - name: email
        label: Adresse e-mail de contact
        type: string
        description: Le formulaire de contact ouvre la messagerie du visiteur avec un message adressé à cette adresse.
        pattern:
          regex: "^$|^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"
          message: Adresse e-mail invalide.
